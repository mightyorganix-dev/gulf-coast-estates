<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seller Desk | Gulf Coast Estates</title>
  <script type="module" crossorigin src="./assets/layout-BN_Rhxej.js"></script>
  <script type="module" crossorigin src="./assets/intake-CGsvUcM7.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/layout-DAaCjLnH.css">
</head>
<body>
  <div id="site-nav"></div>

  <header class="page-hero"><div class="container">
    <h1>Seller CMA request</h1>
    <p>Pricing guidance and seller prep for soft list-to-sold gaps — not portal spam.</p>
  </div></header>
  <main class="page" style="padding-top:0"><div class="container-narrow">
    <form id="intake-form" class="card" style="padding:1.5rem">
      <input type="hidden" id="leadType" value="sell" />
      <div class="grid-2" style="margin-bottom:1rem">
        <div class="field"><label>Name</label><input id="name" required /></div>
        <div class="field"><label>Phone</label><input id="phone" required /></div>
      </div>
      <div class="field" style="margin-bottom:1rem"><label>Email</label><input type="email" id="email" required /></div>
      <div class="field" style="margin-bottom:1rem"><label>Message</label><textarea id="message" rows="4" required></textarea></div>
      <button type="submit" class="btn btn-primary">Submit</button>
      <p class="muted" id="lead-result" style="margin-top:1rem"></p>
    </form>
  </div></main>

  <div id="site-footer"></div>
</body>
</html>
