<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Gulf Coast Estates</title>
  <script type="module" crossorigin src="./assets/contact-CxrMvNS9.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/layout-CvHgV98I.js">
  <link rel="stylesheet" crossorigin href="./assets/layout-BIxfAaS_.css">
</head>
<body>
  <div id="site-nav"></div>

  <header class="page-hero"><div class="container">
    <h1>Contact</h1>
    <p>Gulf Shores, AL 36542 · (251) 555-0140 · desk@gulfcoastestates.example</p>
  </div></header>
  <main class="page" style="padding-top:0"><div class="container-narrow">
    <form id="contact-form" class="card" style="padding:1.5rem">
      <div class="grid-2" style="margin-bottom:1rem">
        <div class="field"><label>Name</label><input id="name" required /></div>
        <div class="field"><label>Email</label><input type="email" id="email" required /></div>
      </div>
      <div class="field" style="margin-bottom:1rem"><label>Message</label><textarea id="message" rows="4" required></textarea></div>
      <button class="btn btn-primary" type="submit">Send</button>
      <p class="muted" id="contact-result" style="margin-top:1rem"></p>
    </form>
  </div></main>

  <div id="site-footer"></div>
</body>
</html>
